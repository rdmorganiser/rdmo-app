  /api/v1/conditions/conditions/:
    get:
      operationId: conditions_conditions_list
      parameters:
      - in: query
        name: relation
        schema:
          type: string
          enum:
          - contains
          - empty
          - eq
          - gt
          - gte
          - lt
          - lte
          - neq
          - notempty
        description: |-
          The relation this condition is using.

          * `eq` - is equal to (==)
          * `neq` - is not equal to (!=)
          * `contains` - contains
          * `gt` - is greater than (>)
          * `gte` - is greater than or equal (>=)
          * `lt` - is lesser than (<)
          * `lte` - is lesser than or equal (<=)
          * `empty` - is empty
          * `notempty` - is not empty
      - in: query
        name: source
        schema:
          type: integer
      - in: query
        name: target_option
        schema:
          type: integer
      - in: query
        name: target_text
        schema:
          type: string
      - in: query
        name: uri
        schema:
          type: string
      - in: query
        name: uri_path
        schema:
          type: string
      - in: query
        name: uri_prefix
        schema:
          type: string
      tags:
      - conditions
      security:
      - basicAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Condition'
          description: ''
    post:
      operationId: conditions_conditions_create
      tags:
      - conditions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Condition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Condition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Condition'
        required: true
      security:
      - basicAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condition'
          description: ''
